# Rebuilds the region pages whenever the region/material data or the template changes,
# so wording can be edited straight in GitHub (data/regions.json, data/materials.json)
# without running anything locally.
name: Build region pages

on:
  push:
    branches: [main]
    paths: ['data/**', 'tools/build.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rebuild region pages" && git push
