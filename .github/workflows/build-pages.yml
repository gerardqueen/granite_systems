# Rebuilds the hub and region pages:
#  - whenever the region/material data or the template changes (edit them straight in GitHub)
#  - every 2 hours, so a region page switches on (and shows new jobs to Google) after its
#    first job is added in the staff page
#  - on demand: Actions → "Build region pages" → Run workflow
# It only commits when something actually changed.
name: Build region pages

on:
  push:
    branches: [main]
    paths: ['data/**', 'tools/build.mjs']
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Rebuild region pages" && git push; fi
